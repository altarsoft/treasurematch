<!doctype html>
<html>
       <head>
              <title>Mahjong</title>
              <meta http-equiv="content-type" content="text/html; charset=UTF-8">
              <meta id="gameViewport" name="viewport" content="width=device-width initial-scale=1">
              <link href="styles.css" rel="stylesheet" type="text/css">
			  
			<script src="sdk.js"></script> 
			<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
			
			<script>			
			GamePix.loaded().then(function () 
			{
			
				GamePix.interstitialAd().then(function (res) {

				if (res.success) {
				  // Log the success if you want
				  info();
				} else {

				  errorInfo();
				}
			  });
			
			})

       </head>

       <body>
              <div align="center" id="embed-html"></div>
              <script type="text/javascript" src="html/html.nocache.js"></script>
       </body>

       <script>
              function handleMouseDown(evt) {
                evt.preventDefault();
                evt.stopPropagation();
                window.focus();
              }

              function handleMouseUp(evt) {
                evt.preventDefault();
                evt.stopPropagation();
              }
				  
			  function contextMenu(evt) {
                evt.preventDefault();
                evt.stopPropagation();
              }
			  
              document.getElementById('embed-html').addEventListener('mousedown', handleMouseDown, false);
              document.getElementById('embed-html').addEventListener('mouseup', handleMouseUp, false);
			  document.getElementById('embed-html').addEventListener('contextmenu', contextMenu, false);  
       </script>
</html>
